# Al subir una etiqueta v5.4.13 (por ejemplo): comprueba que la versión del .toc coincide
# y publica GuildUnion-5.4.13.zip como Release de GitHub.
# El zip lleva la carpeta GuildUnion/ con el addon, sin lo que .pkgmeta ignora (Tools, Bench...)
# ni los archivos del repositorio (.github, .claude, .luacheckrc...).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar versión del .toc
        id: ver
        run: |
          tag="${GITHUB_REF_NAME#v}"
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' GuildUnion.toc | tr -d '\r' | head -1)
          echo "Etiqueta: $tag  /  .toc: $toc"
          if [ "$tag" != "$toc" ]; then
            echo "::error::La etiqueta (v$tag) no coincide con ## Version del .toc ($toc)"
            exit 1
          fi
          echo "version=$toc" >> "$GITHUB_OUTPUT"

      - name: Empaquetar zip
        run: |
          mkdir -p .release/GuildUnion
          git ls-files -z \
            | grep -zv -E '^(\.github/|\.claude/|docs/|Tools/|Bench/|\.gitignore$|\.gitattributes$|\.pkgmeta$|\.luacheckrc$)' \
            | xargs -0 cp --parents -t .release/GuildUnion
          cd .release
          zip -r -9 "../GuildUnion-${{ steps.ver.outputs.version }}.zip" GuildUnion
          cd ..
          unzip -l "GuildUnion-${{ steps.ver.outputs.version }}.zip" | tail -3

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: GuildUnion-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
